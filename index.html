<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наше Пространство</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <!-- Tailwind CSS для стилей -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Закатный фиолетово-розовый градиент на фоне */
        body {
            background: linear-gradient(180deg, #1e112a 0%, #3a1c5c 40%, #632c65 80%, #a85475 100%);
            min-height: 100vh;
            color: #f3e8ff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        /* Эффект матового стекла для карточек (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .active-tab {
            color: #f472b6; /* Неоново-розовый активный цвет */
            filter: drop-shadow(0 0 8px rgba(244, 114, 182, 0.6));
        }
    </style>
</head>
<body class="flex flex-col justify-between pb-24">

    <!-- ВЕРХНЯЯ ШАПКА -->
    <header class="p-6 text-center">
        <p class="text-xs uppercase tracking-widest text-purple-300 opacity-80">Ты здесь. Я здесь.</p>
    </header>

    <!-- КОНТЕНТНАЯ ЗОНА (ЭКРАНЫ) -->
    <main class="px-4 flex-grow flex items-center justify-center">
        
        <!-- ЭКРАН 1: Островок тепла (Активен по умолчанию) -->
        <div id="screen-home" class="w-full max-w-sm space-y-6">
            <!-- Главное фото заката / воспоминания -->
            <div class="relative w-full aspect-[4/5] rounded-3xl overflow-hidden shadow-2xl border border-purple-500/20">
                <img src="https://unsplash.com" 
                     alt="Наш закат" 
                     class="w-full h-full object-cover">
                <!-- Затемнение внизу фотографии -->
                <div class="absolute inset-0 bg-gradient-to-t from-[#1e112a] via-transparent to-transparent"></div>
                <div class="absolute bottom-4 left-4 right-4 text-center">
                    <p class="text-sm font-medium text-purple-200">Тот самый вечер у реки</p>
                </div>
            </div>

            <!-- Мягкая кнопка «Помню это» -->
            <button onclick="sendTouch()" class="w-full py-4 rounded-2xl glass-card text-center font-medium tracking-wide active:scale-95 transition-all duration-200 hover:bg-white/10 flex items-center justify-center gap-2">
                <span>П о м н ю &nbsp; э т о</span>
                <span class="text-rose-400 text-lg">✨</span>
            </button>
        </div>

        <!-- ЭКРАН 2: Капсула времени (Скрыт) -->
        <div id="screen-capsule" class="hidden w-full max-w-md">
            <h2 class="text-xl font-light mb-4 text-purple-200">Копилка моментов</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="glass-card p-4 rounded-2xl aspect-square flex flex-col justify-between">
                    <span class="text-xs text-purple-300">12 Октября</span>
                    <p class="text-sm text-purple-100">Послушай этот трек, напомнил о нас...</p>
                </div>
                <div class="glass-card p-4 rounded-2xl aspect-square bg-purple-900/20">
                    <span class="text-xs text-purple-300">Вчера</span>
                    <p class="text-sm text-purple-100">Хочу вернуться в тот парк 💜</p>
                </div>
            </div>
        </div>

        <!-- ЭКРАН 3: Прикосновения (Скрыт) -->
        <div id="screen-touch" class="hidden w-full max-w-sm text-center space-y-6">
            <p class="text-sm text-purple-200 font-light">Коснись экрана, чтобы отправить тепло</p>
            <div onclick="triggerPulse()" class="w-48 h-48 mx-auto rounded-full glass-card flex items-center justify-center cursor-pointer active:scale-95 transition-transform bg-gradient-to-tr from-purple-600/20 to-pink-500/20 shadow-[0_0_50px_rgba(147,51,234,0.2)]">
                <div class="w-32 h-32 rounded-full bg-purple-500/10 border border-purple-400/30 flex items-center justify-center text-3xl">🌌</div>
            </div>
        </div>

        <!-- ЭКРАН 4: Мы когда-нибудь (Скрыт) -->
        <div id="screen-future" class="hidden w-full max-w-sm space-y-4">
            <h2 class="text-xl font-light text-purple-200">Наше «Когда-нибудь»</h2>
            <div class="space-y-2">
                <div class="glass-card p-4 rounded-xl flex items-center gap-3">
                    <input type="checkbox" class="rounded bg-purple-900 border-purple-500 text-pink-500 focus:ring-0">
                    <span class="text-sm">Встретить рассвет на крыше</span>
                </div>
                <div class="glass-card p-4 rounded-xl flex items-center gap-3">
                    <input type="checkbox" class="rounded bg-purple-900 border-purple-500 text-pink-500 focus:ring-0">
                    <span class="text-sm">Приготовить вместе лазанью</span>
                </div>
            </div>
        </div>

    </main>

    <!-- НИЖНЯЯ НАВИГАЦИЯ (МАТОВОЕ СТЕКЛО) -->
    <nav class="fixed bottom-4 left-4 right-4 h-16 rounded-2xl glass-card flex justify-around items-center px-2">
        <button onclick="switchTab('home')" id="tab-home" class="flex flex-col items-center text-xs gap-1 active-tab">
            <span class="text-xl">🌌</span>
            <span>Главная</span>
        </button>
        <button onclick="switchTab('capsule')" id="tab-capsule" class="flex flex-col items-center text-xs gap-1 text-purple-300">
            <span class="text-xl">🔮</span>
            <span>Капсула</span>
        </button>
        <button onclick="switchTab('touch')" id="tab-touch" class="flex flex-col items-center text-xs gap-1 text-purple-300">
            <span class="text-xl">✨</span>
            <span>Присутствие</span>
        </button>
        <button onclick="switchTab('future')" id="tab-future" class="flex flex-col items-center text-xs gap-1 text-purple-300">
            <span class="text-xl">⏳</span>
            <span>Планы</span>
        </button>
    </nav>

    <!-- СКРИПТ ДЛЯ ПЕРЕКЛЮЧЕНИЯ ВКЛАДОК -->
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        function switchTab(tabName) {
            // Скрываем все экраны
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-capsule').classList.add('hidden');
            document.getElementById('screen-touch').classList.add('hidden');
            document.getElementById('screen-future').classList.add('hidden');

            // Убираем активный класс со всех кнопок
            document.getElementById('tab-home').classList.remove('active-tab');
            document.getElementById('tab-capsule').classList.remove('active-tab');
            document.getElementById('tab-touch').classList.remove('active-tab');
            document.getElementById('tab-future').classList.remove('active-tab');

            // Показываем нужный экран и активируем кнопку
            document.getElementById(`screen-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('active-tab');
            
            // Легкая вибрация телефона при клике (фишка Telegram Mini App)
            tg?.HapticFeedback?.impactOccurred('light');
        }

        function sendTouch() {
            tg?.HapticFeedback?.notificationOccurred('success');
            alert('Ты отправил лучи тепла! ❤️ (Позже тут будет отправка в базу данных)');
        }

        function triggerPulse() {
            tg?.HapticFeedback?.impactOccurred('medium');
        }
    </script>
</body>
</html>
